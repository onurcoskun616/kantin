# Topkapi Kantin - nginx ters vekil (reverse proxy) yapilandirmasi
#
# Kurulum:
#   sudo cp deploy/nginx-kantin.conf /etc/nginx/sites-available/kantin
#   sudo ln -s /etc/nginx/sites-available/kantin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kantin.topkapiokullari.com
#
# certbot calistiktan sonra 443 blogunu ve sertifika satirlarini kendisi ekler.

server {
    listen 80;
    listen [::]:80;
    server_name kantin.topkapiokullari.com;   # <-- kendi alan adinizla degistirin

    # Let's Encrypt dogrulamasi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # certbot kurulduktan sonra bu satir HTTPS'e yonlendirmeyi saglar
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kantin.topkapiokullari.com;   # <-- kendi alan adinizla degistirin

    # certbot bu iki satiri kendisi doldurur
    # ssl_certificate     /etc/letsencrypt/live/kantin.topkapiokullari.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kantin.topkapiokullari.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Guvenlik basliklari
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Excel yuklemeleri icin yeterli govde boyutu
    client_max_body_size 12M;

    # Kaba kuvvet giris denemelerini yavaslat
    location /api/auth/login {
        limit_req zone=kantin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/kantin-access.log;
    error_log  /var/log/nginx/kantin-error.log;
}
