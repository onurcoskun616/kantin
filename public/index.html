<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Topkapı Kantin Yönetim Sistemi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ------------------------------ Giriş ------------------------------ -->
<div id="loginScreen" class="login-screen" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="login-brand">
      <div class="login-logo">TO</div>
      <div>
        <h1>Kantin Yönetim Sistemi</h1>
        <p>Topkapı Okulları · 5 Kampüs</p>
      </div>
    </div>
    <label class="field">
      <span>E-posta</span>
      <input type="email" name="email" required autocomplete="username" placeholder="ornek@topkapiokullari.com">
    </label>
    <label class="field">
      <span>Parola</span>
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    </label>
    <div id="loginError" class="alert alert-danger" hidden></div>
    <button type="submit" class="btn btn-primary btn-block">Giriş Yap</button>
    <p class="login-hint">Şifrenizi bilmiyorsanız kampüs yöneticinize başvurun.</p>
  </form>
</div>

<!-- ---------------------------- Uygulama ----------------------------- -->
<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="login-logo sm">TO</div>
      <div class="sidebar-title">
        <strong>Kantin Yönetimi</strong>
        <small>Topkapı Okulları</small>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Menüyü kapat">✕</button>
    </div>
    <nav id="mainNav" class="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="userAvatar">?</div>
        <div class="user-meta">
          <strong id="userName">—</strong>
          <small id="userRole">—</small>
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="btn btn-ghost btn-sm" id="changePasswordBtn">Parola</button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Çıkış</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü">☰</button>
      <h2 id="pageTitle">Panel</h2>
      <div class="topbar-right">
        <label class="inline-field" id="campusSelectWrap">
          <span>Kampüs</span>
          <select id="campusSelect"></select>
        </label>
        <button class="icon-btn" id="themeBtn" title="Tema değiştir">◐</button>
      </div>
    </header>
    <main id="pageContent" class="content"></main>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="modalRoot"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
